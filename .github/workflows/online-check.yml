# Temporary check: can two browsers meet online through each network?
name: Online connection check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/online-check/**"
      - ".github/workflows/online-check.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: (npx vite preview --port 4173 --strictPort &) && sleep 3 && node .github/online-check/check.cjs
